site_name: Burble
site_description: Open-source worldbuilding ontology and platform

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

docs_dir: docs

nav:
  - Home: index.md
  - Ontology:
      - Overview: ontology/overview.md
      - Archetypes: ontology/archetypes.md
      - Composites: ontology/composites.md
      - Classification: ontology/classification.md
  - Architecture:
      - Services: architecture/services.md
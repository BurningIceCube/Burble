services:
  neo4j:
    image: neo4j:5
    container_name: burble-neo4j
    environment:
      - NEO4J_AUTH=none
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  burble:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: burble-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_NEO4J_URI=bolt://neo4j:7687
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j-data:

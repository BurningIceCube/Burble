plugins {
    id 'org.springframework.boot'
}

springBoot {
    mainClass = 'com.bic.burble.BurbleApplication'
}

dependencies {
    implementation project(':shared')
    implementation project(':ontology')
    implementation project(':story')
    implementation project(':state')
    implementation project(':game')
    implementation project(':forum')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    runtimeOnly 'com.h2database:h2'
    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-test-autoconfigure
    implementation("org.springframework.boot:spring-boot-test-autoconfigure:4.1.1")

    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

bootJar {
    archiveClassifier = ''
}

jar {
    archiveClassifier = 'plain'
}
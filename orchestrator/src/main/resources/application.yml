spring:
  application:
    name: burble
  datasource:
    url: jdbc:h2:mem:burble;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update

# world: json | h2. entity: json | neo4j.
# Neo4j auto-configuration is switched off unless entity is neo4j
# (see Neo4jAutoConfigurationFilter in the ontology module).
# json stores worlds and entities in one file. Archetypes are IS_A statements on the entity.
burble:
  ontology:
    persistance:
      world: json
      entity: json
      json:
        path: data/ontology.json

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.bic.burble: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

